name: Offline portfolio checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q case-study-02/soar case-study-03/app/backend case-study-03/automation
      - run: bash -n case-study-03/deploy-local.sh
