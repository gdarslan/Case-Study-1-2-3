name: Deploy SOAR Processor

on:
  push:
    branches:
      - main
    paths:
      - 'soar/**'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t soar-processor:latest ./soar

      - name: Tag and push to ECR
        run: |
          ECR_URI=${{ steps.login-ecr.outputs.registry }}/soar-processor
          docker tag soar-processor:latest $ECR_URI:latest
          docker push $ECR_URI:latest

      - name: Force ECS redeploy
        run: |
          aws ecs update-service \
            --cluster soar-cluster \
            --service soar-processor \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}
