name: CI/CD — Build & Push to ECR

on:
  push:
    branches: [main, CaseStudy3]
  pull_request:
    branches: [main, CaseStudy3]

env:
  AWS_REGION: eu-central-1

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: app/backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/innovatech/hr-backend:latest
            ${{ steps.ecr-login.outputs.registry }}/innovatech/hr-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: app/frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/innovatech/hr-frontend:latest
            ${{ steps.ecr-login.outputs.registry }}/innovatech/hr-frontend:${{ github.sha }}

      - name: Summary
        run: |
          echo "Images pushed to ECR:"
          echo "  Backend:  ${{ steps.ecr-login.outputs.registry }}/innovatech/hr-backend:${{ github.sha }}"
          echo "  Frontend: ${{ steps.ecr-login.outputs.registry }}/innovatech/hr-frontend:${{ github.sha }}"
