<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Innovatech HR Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
    }

    header {
      background: #16213e;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 1.3rem; letter-spacing: 0.03em; }
    header span { font-size: 0.85rem; opacity: 0.6; }

    main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .toolbar h2 { font-size: 1.1rem; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1.1rem;
      font-size: 0.9rem;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }

    .btn-primary   { background: #0f3460; color: #fff; }
    .btn-edit      { background: #e8c740; color: #1a1a2e; }
    .btn-deactivate{ background: #e94560; color: #fff; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    thead { background: #16213e; color: #fff; }
    th, td { padding: 0.85rem 1rem; text-align: left; font-size: 0.9rem; }
    tbody tr:nth-child(even) { background: #f7f8fa; }
    tbody tr:hover { background: #eef1f7; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.7rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .badge-active   { background: #d4edda; color: #155724; }
    .badge-inactive { background: #f8d7da; color: #721c24; }
    .badge-pending  { background: #fff3cd; color: #856404; }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }

    .modal h3 { margin-bottom: 1.2rem; font-size: 1.1rem; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: #555; }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.55rem 0.8rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .modal-actions { display: flex; gap: 0.7rem; justify-content: flex-end; margin-top: 1.5rem; }
    .btn-cancel { background: #e0e0e0; color: #333; }

    #error-msg { color: #e94560; font-size: 0.85rem; margin-top: 0.5rem; }
  </style>
</head>
<body>

<header>
  <h1>Innovatech HR Portal</h1>
  <span>Employee Management</span>
</header>

<main>
  <div class="toolbar">
    <h2>Employees</h2>
    <button class="btn-primary" onclick="openModal()">+ Add Employee</button>
  </div>

  <table id="emp-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Department</th>
        <th>Role</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="emp-body">
      <tr><td colspan="7" style="text-align:center;padding:2rem;color:#999">Loading...</td></tr>
    </tbody>
  </table>
</main>

<!-- Add / Edit Modal -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="modal-title">Add Employee</h3>
    <div class="form-group">
      <label>Full Name</label>
      <input id="f-name" type="text" placeholder="Jane Doe" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input id="f-email" type="email" placeholder="jane.doe@example.com" />
    </div>
    <div class="form-group">
      <label>Department</label>
      <input id="f-department" type="text" placeholder="Engineering" />
    </div>
    <div class="form-group">
      <label>Role</label>
      <select id="f-role">
        <option value="developer">Developer</option>
        <option value="admin">Admin</option>
        <option value="hr">HR</option>
        <option value="readonly">Read-only</option>
      </select>
    </div>
    <div class="form-group" id="status-group" style="display:none">
      <label>Status</label>
      <select id="f-status">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
        <option value="pending">Pending</option>
      </select>
    </div>
    <div id="error-msg"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveEmployee()">Save</button>
    </div>
  </div>
</div>

<script>
  // When running locally, hit the backend directly.
  // When deployed, use empty string so "/api/employees" goes through nginx proxy.
  const API = window.location.hostname === "localhost"
    ? "http://localhost:8000"
    : "";

  let editingId = null;

  async function fetchEmployees() {
    const res  = await fetch(`${API}/api/employees`);
    const data = await res.json();
    const tbody = document.getElementById("emp-body");

    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:2rem;color:#999">No employees found.</td></tr>`;
      return;
    }

    tbody.innerHTML = data.map(e => `
      <tr>
        <td>${e.id}</td>
        <td>${e.name}</td>
        <td>${e.email}</td>
        <td>${e.department}</td>
        <td>${e.role}</td>
        <td><span class="badge badge-${e.status}">${e.status}</span></td>
        <td>
          <button class="btn-edit" onclick="openModal(${e.id})">Edit</button>
          ${e.status === 'active'
            ? `<button class="btn-deactivate" onclick="deactivate(${e.id})" style="margin-left:6px">Deactivate</button>`
            : ''}
        </td>
      </tr>
    `).join("");
  }

  function openModal(id = null) {
    editingId = id;
    document.getElementById("error-msg").textContent = "";

    if (id) {
      document.getElementById("modal-title").textContent = "Edit Employee";
      document.getElementById("status-group").style.display = "block";
      fetch(`${API}/api/employees/${id}`)
        .then(r => r.json())
        .then(e => {
          document.getElementById("f-name").value       = e.name;
          document.getElementById("f-email").value      = e.email;
          document.getElementById("f-department").value = e.department;
          document.getElementById("f-role").value       = e.role;
          document.getElementById("f-status").value     = e.status;
        });
    } else {
      document.getElementById("modal-title").textContent = "Add Employee";
      document.getElementById("status-group").style.display = "none";
      ["f-name","f-email","f-department"].forEach(id => document.getElementById(id).value = "");
      document.getElementById("f-role").value = "developer";
    }

    document.getElementById("modal").classList.add("open");
  }

  function closeModal() {
    document.getElementById("modal").classList.remove("open");
    editingId = null;
  }

  async function saveEmployee() {
    const body = {
      name:       document.getElementById("f-name").value.trim(),
      email:      document.getElementById("f-email").value.trim(),
      department: document.getElementById("f-department").value.trim(),
      role:       document.getElementById("f-role").value,
    };

    if (editingId) {
      body.status = document.getElementById("f-status").value;
    }

    if (!body.name || !body.email || !body.department) {
      document.getElementById("error-msg").textContent = "All fields are required.";
      return;
    }

    const url    = editingId ? `${API}/api/employees/${editingId}` : `${API}/api/employees`;
    const method = editingId ? "PUT" : "POST";

    const res = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      const err = await res.json();
      document.getElementById("error-msg").textContent = err.detail || "Something went wrong.";
      return;
    }

    closeModal();
    fetchEmployees();
  }

  async function deactivate(id) {
    if (!confirm("Deactivate this employee?")) return;
    await fetch(`${API}/api/employees/${id}`, { method: "DELETE" });
    fetchEmployees();
  }

  // Close modal on backdrop click
  document.getElementById("modal").addEventListener("click", e => {
    if (e.target === e.currentTarget) closeModal();
  });

  fetchEmployees();
</script>
</body>
</html>
