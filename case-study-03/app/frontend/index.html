<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Innovatech HR Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
    }

    header {
      background: #16213e;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 1.3rem; letter-spacing: 0.03em; }
    header span { font-size: 0.85rem; opacity: 0.6; }

    main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .toolbar h2 { font-size: 1.1rem; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1.1rem;
      font-size: 0.9rem;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }

    .btn-primary   { background: #0f3460; color: #fff; }
    .btn-edit      { background: #e8c740; color: #1a1a2e; }
    .btn-deactivate{ background: #e94560; color: #fff; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    thead { background: #16213e; color: #fff; }
    th, td { padding: 0.85rem 1rem; text-align: left; font-size: 0.9rem; }
    tbody tr:nth-child(even) { background: #f7f8fa; }
    tbody tr:hover { background: #eef1f7; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.7rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .badge-active   { background: #d4edda; color: #155724; }
    .badge-inactive { background: #f8d7da; color: #721c24; }
    .badge-pending  { background: #fff3cd; color: #856404; }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }

    .modal h3 { margin-bottom: 1.2rem; font-size: 1.1rem; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: #555; }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.55rem 0.8rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .modal-actions { display: flex; gap: 0.7rem; justify-content: flex-end; margin-top: 1.5rem; }
    .btn-cancel { background: #e0e0e0; color: #333; }

    #error-msg { color: #e94560; font-size: 0.85rem; margin-top: 0.5rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>

<header>
  <h1>Innovatech HR Portal</h1>
  <span>Employee Management</span>
</header>

<main>
  <form id="login-form" style="display:flex;gap:.5rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap">
    <label for="access-token">Demo access token</label>
    <input id="access-token" type="password" autocomplete="off" required />
    <button class="btn-primary" type="submit">Sign in</button>
    <span id="login-error" role="status"></span>
  </form>
  <div id="session-info" hidden style="margin-bottom:1rem">
    <span id="session-role"></span>
    <button type="button" class="btn-cancel" id="sign-out">Sign out</button>
  </div>
  <div class="toolbar">
    <h2>Employees</h2>
    <button id="add-employee" class="btn-primary" onclick="openModal()" disabled>+ Add Employee</button>
  </div>

  <table id="emp-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Department</th>
        <th>Role</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="emp-body">
      <tr><td colspan="7" style="text-align:center;padding:2rem;color:#999">Sign in to view employees.</td></tr>
    </tbody>
  </table>
</main>

<!-- Add / Edit Modal -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="modal-title">Add Employee</h3>
    <div class="form-group">
      <label>Full Name</label>
      <input id="f-name" type="text" placeholder="Jane Doe" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input id="f-email" type="email" placeholder="jane.doe@example.com" />
    </div>
    <div class="form-group">
      <label>Department</label>
      <input id="f-department" type="text" placeholder="Engineering" />
    </div>
    <div class="form-group">
      <label>Role</label>
      <select id="f-role">
        <option value="developer">Developer</option>
        <option value="admin">Admin</option>
        <option value="hr">HR</option>
        <option value="readonly">Read-only</option>
      </select>
    </div>
    <div class="form-group" id="status-group" style="display:none">
      <label>Status</label>
      <select id="f-status">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
        <option value="pending">Pending</option>
      </select>
    </div>
    <div id="error-msg"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveEmployee()">Save</button>
    </div>
  </div>
</div>

<script>
  // Same-origin Nginx proxy; never expose the token in URLs or persistent browser storage.
  let token = "";
  let role = "";
  let editingId = null;
  const $ = id => document.getElementById(id);
  const body = $("emp-body");

  function showMessage(message) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 7;
    td.textContent = message;
    td.style.textAlign = "center";
    tr.appendChild(td);
    body.replaceChildren(tr);
  }

  async function apiFetch(path, options = {}) {
    return fetch(path, {
      ...options,
      credentials: "same-origin",
      headers: { ...(options.headers || {}), Authorization: "Bearer " + token }
    });
  }

  function signOut(message = "") {
    token = "";
    role = "";
    $("access-token").value = "";
    $("login-form").hidden = false;
    $("session-info").hidden = true;
    $("add-employee").disabled = true;
    $("login-error").textContent = message;
    closeModal();
    showMessage("Sign in to view employees.");
  }

  $("login-form").addEventListener("submit", async event => {
    event.preventDefault();
    token = $("access-token").value;
    $("access-token").value = "";
    try {
      const res = await apiFetch("/api/session");
      if (!res.ok) throw new Error("Invalid access token.");
      role = (await res.json()).role;
      $("login-form").hidden = true;
      $("session-info").hidden = false;
      $("session-role").textContent = "Signed in as " + role;
      $("add-employee").disabled = role !== "admin";
      await fetchEmployees();
    } catch (err) {
      signOut(err.message || "Unable to sign in.");
    }
  });
  $("sign-out").addEventListener("click", () => signOut());

  function actionButton(label, className, action) {
    const button = document.createElement("button");
    button.textContent = label;
    button.className = className;
    button.addEventListener("click", action);
    return button;
  }

  async function fetchEmployees() {
    if (!token) return;
    const activeToken = token;
    try {
      const res = await apiFetch("/api/employees");
      if (activeToken !== token) return;
      if (res.status === 401) return signOut("Please sign in again.");
      if (!res.ok) throw new Error("Unable to fetch employee records.");
      const rows = await res.json();
      if (activeToken !== token) return;
      if (!rows.length) return showMessage("No employees found.");
      body.replaceChildren();
      for (const e of rows) {
        const tr = document.createElement("tr");
        // Employee data is text, never executable markup.
        for (const value of [e.id, e.name, e.email, e.department, e.role]) {
          const td = document.createElement("td");
          td.textContent = value ?? "";
          tr.appendChild(td);
        }
        const status = document.createElement("td");
        const badge = document.createElement("span");
        const safeStatus = ["active", "inactive", "pending"].includes(e.status) ? e.status : "unknown";
        badge.className = "badge badge-" + safeStatus;
        badge.textContent = safeStatus;
        status.appendChild(badge);
        tr.appendChild(status);
        const controls = document.createElement("td");
        if (role === "admin") {
          controls.appendChild(actionButton("Edit", "btn-edit", () => openModal(e.id)));
          if (e.status === "active") controls.appendChild(actionButton("Deactivate", "btn-deactivate", () => deactivate(e.id)));
        } else {
          controls.textContent = "Read-only";
        }
        tr.appendChild(controls);
        body.appendChild(tr);
      }
    } catch (err) {
      if (activeToken === token) showMessage(err.message);
    }
  }

  async function openModal(id = null) {
    if (role !== "admin") return;
    editingId = id;
    $("error-msg").textContent = "";
    $("f-email").disabled = id !== null;
    $("status-group").style.display = id ? "block" : "none";
    $("modal-title").textContent = id ? "Edit Employee" : "Add Employee";
    if (id) {
      const res = await apiFetch("/api/employees/" + encodeURIComponent(id));
      if (!res.ok || role !== "admin") return;
      const e = await res.json();
      if (role !== "admin") return;
      for (const field of ["name", "email", "department", "role", "status"]) $("f-" + field).value = e[field];
    } else {
      for (const field of ["name", "email", "department"]) $("f-" + field).value = "";
      $("f-role").value = "developer";
    }
    $("modal").classList.add("open");
  }

  function closeModal() {
    $("modal").classList.remove("open");
    editingId = null;
  }

  async function saveEmployee() {
    if (role !== "admin") return;
    const data = {name: $("f-name").value.trim(), department: $("f-department").value.trim(), role: $("f-role").value};
    if (editingId) data.status = $("f-status").value;
    else data.email = $("f-email").value.trim();
    if (!data.name || !data.department || (!editingId && !data.email)) {
      $("error-msg").textContent = "All required fields must be filled.";
      return;
    }
    const route = editingId ? "/api/employees/" + encodeURIComponent(editingId) : "/api/employees";
    try {
      const res = await apiFetch(route, {
        method: editingId ? "PUT" : "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
      });
      if (res.status === 401) return signOut("Please sign in again.");
      if (!res.ok) {
        const err = await res.json();
        $("error-msg").textContent = typeof err.detail === "string" ? err.detail : "Check the input values.";
        return;
      }
      closeModal();
      await fetchEmployees();
    } catch {
      $("error-msg").textContent = "Unable to save employee.";
    }
  }

  async function deactivate(id) {
    if (role !== "admin" || !confirm("Deactivate this employee?")) return;
    const res = await apiFetch("/api/employees/" + encodeURIComponent(id), {method: "DELETE"});
    if (res.status === 401) return signOut("Please sign in again.");
    if (!res.ok) return showMessage("Deactivation failed.");
    await fetchEmployees();
  }
  $("modal").addEventListener("click", e => {
    if (e.target === e.currentTarget) closeModal();
  });
</script>
</body>
</html>
