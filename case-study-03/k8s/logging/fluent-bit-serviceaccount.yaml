# Service account annotated with the IRSA role so Fluent Bit can write to CloudWatch
# Replace <FLUENT_BIT_ROLE_ARN> with the value from: terraform output fluent_bit_role_arn
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logging
  annotations:
    eks.amazonaws.com/role-arn: <FLUENT_BIT_ROLE_ARN>
