# Horizontal Pod Autoscaler — scales pods based on CPU load (Phase 4: design for failure)
# Requires metrics-server installed in the cluster:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hr-backend-hpa
  namespace: hr-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hr-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hr-frontend-hpa
  namespace: hr-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hr-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
