apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-backend
  namespace: hr-app
  labels:
    app: hr-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hr-backend
  template:
    metadata:
      labels:
        app: hr-backend
    spec:
      containers:
        - name: hr-backend
          image: <AWS_ACCOUNT_ID>.dkr.ecr.eu-central-1.amazonaws.com/innovatech/hr-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: hr-db-secret
            - secretRef:
                name: hr-api-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: hr-backend
  namespace: hr-app
spec:
  selector:
    app: hr-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
