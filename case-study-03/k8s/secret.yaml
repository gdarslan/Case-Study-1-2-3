# Fill in base64-encoded values before applying:
#   echo -n "your-value" | base64
#
# Apply with:
#   kubectl apply -f secret.yaml -n hr-app
apiVersion: v1
kind: Secret
metadata:
  name: hr-db-secret
  namespace: hr-app
type: Opaque
data:
  DB_HOST: <base64-encoded-rds-endpoint>
  DB_PORT: NTQzMg==        # 5432
  DB_NAME: aW5ub3ZhdGVjaA== # innovatech
  DB_USER: aW5ub3ZhdGVjaF9hZG1pbg==  # innovatech_admin
  DB_PASS: <base64-encoded-password>
